name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the linter diffs pull requests against main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Lint changed pages
        if: github.event_name == 'pull_request'
        run: node linter/cli.js --diff origin/main --ci
      - name: Lint every page
        if: github.event_name == 'push'
        run: |
          node linter/cli.js docs/docs/ --ci
          node linter/cli.js i18n/fr/docusaurus-plugin-content-docs/current/docs/ --ci

  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The MCP prepare_pr tool and the diff-based linter tests resolve the
          # PR diff base through git: a shallow checkout carries no branch ref
          # (see PROBLEMS.md, "Diff-based tests need git in their CI job").
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test linter/tests/*.test.js mcp/tests/*.test.js

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn build
      # The synonym map is query-side only: nothing fails at build time if a
      # member can never match. Validate it against the real built index.
      - run: yarn validate:search
